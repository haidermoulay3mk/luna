<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Luna: Junior Astronaut Mission Trainer</title>
    <meta
      name="description"
      content="A Moon-base decision game for kids aged 7-12 by Team GWIN (NASA Space Apps 2026). Code written with help from Claude (Anthropic)."
    />
    <meta name="author" content="Team GWIN" />
    <meta name="theme-color" content="#070A12" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='9' fill='none' stroke='%237C9CFF' stroke-width='2.5'/%3E%3Ccircle cx='12' cy='12' r='3.5' fill='%237C9CFF'/%3E%3C/svg%3E"
    />
  </head>
  <body style="background: #070a12">
    <noscript>Luna needs JavaScript turned on.</noscript>
    <div id="root"></div>
    <!-- Shown only if the game never starts from a double-clicked file (e.g. this source file or dist/). -->
    <div
      id="boot-help"
      hidden
      style="max-width: 36rem; margin: 15vh auto; padding: 24px; font: 18px/1.5 system-ui, sans-serif; color: #fff; background: #0e1322; border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 18px"
    >
      <strong>Luna could not start from this file.</strong><br />
      To play offline, open <code>dist-usb/index.html</code> (the one-file version).<br />
      To work on the game, run <code>npm run dev</code> and open http://localhost:5173.
    </div>
    <script>
      if (location.protocol === 'file:') {
        setTimeout(function () {
          var root = document.getElementById('root');
          if (root && !root.hasChildNodes()) document.getElementById('boot-help').hidden = false;
        }, 4000);
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
